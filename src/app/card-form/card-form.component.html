<div class="container">
    <form [formGroup]="cardForm" (ngSubmit)="submitForm()">
        <app-input [type]="'text'" [placeHolder]="'please enter name'" [label]="'Name'"
            [control]="$any(cardForm).get('name')"></app-input>
        <app-input [type]="'number'" [placeHolder]="'please enter card number'" [label]="'card Number'"
            [control]="$any(cardForm).get('cardNumber')"></app-input>
        <div class="columns">
            <div class="column">
                <app-input [type]="'date'" [placeHolder]="'please enter expire date'" [label]="'expire Date'"
                    [control]="$any(cardForm).get('expiryDate')"></app-input>
            </div>
            <div class="column">
                <app-input [type]="'number'" [placeHolder]="'please enter security code'" [label]="'security Code'"
                    [control]="$any(cardForm).get('securityCode')"></app-input>
            </div>
        </div>
        <button [disabled]="cardForm.invalid" type="submit" class="button is-success is-small mt-4">Submit</button>
        <button [disabled]="!cardForm.dirty" type="submit" class="button is-warning is-small mt-4" (click)="onResetForm()">Reset</button>
    </form>
</div>
